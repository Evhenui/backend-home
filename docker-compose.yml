version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: notes-postgres-home-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: notes_user
      POSTGRES_PASSWORD: notes_password
      POSTGRES_DB: notes_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:            
    build: .                   
    container_name: notes-api
    restart: unless-stopped
    depends_on:
      - postgres     
    environment:
      DATABASE_URL: postgresql://notes_user:notes_password@postgres:5432/notes_db
      JWT_SECRET: change-me-super-secret-at-least-32-chars
      NODE_ENV: production
    ports:
      - '3000:3000'

  redis:         
    image: redis:7-alpine
    container_name: notes-redis
    restart: unless-stopped
    ports:
      - '6379:6379'    

volumes:
  postgres_data: