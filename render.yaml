services:
  - type: web
    name: notes-api
    runtime: docker 
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: false 
    healthCheckPath: /health 
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: LOG_LEVEL
        value: info
      - key: JWT_SECRET
        generateValue: true 
      - key: CORS_ORIGIN
        value: https://your-frontend.example.com
      - key: DATABASE_URL
        fromDatabase:  
          name: notes-db
          property: connectionString
      - key: REDIS_HOST
        fromService: 
          type: keyvalue
          name: notes-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: notes-redis
          property: port

  - type: worker
    name: notes-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: node dist/queue/email.worker.js 
    plan: free
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: notes-db
          property: connectionString
      - key: JWT_SECRET
        fromService: 
          type: web
          name: notes-api
          envVarKey: JWT_SECRET
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: notes-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: notes-redis
          property: port

  - type: keyvalue
    name: notes-redis
    plan: free
    maxmemoryPolicy: noeviction  
    ipAllowList: [] 

databases:
  - name: notes-db
    plan: free
    databaseName: notes_db
    user: notes_user